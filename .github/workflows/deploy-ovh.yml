name: Publier sur OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autofocus-ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Envoyer le site vers OVH
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Installer le client SFTP
        run: sudo apt-get install --yes lftp

      - name: Publier les fichiers statiques
        env:
          OVH_FTP_SERVER: ${{ secrets.OVH_FTP_SERVER }}
          OVH_FTP_USERNAME: ${{ secrets.OVH_FTP_USERNAME }}
          OVH_FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p 22 "$OVH_FTP_SERVER" >> "$HOME/.ssh/known_hosts"

          lftp -u "$OVH_FTP_USERNAME,$OVH_FTP_PASSWORD" \
            "sftp://$OVH_FTP_SERVER:22" <<LFTP_COMMANDS
          set cmd:fail-exit true
          mirror --reverse --verbose \
            --exclude-glob ".git*" \
            --exclude-glob ".github*" \
            ./ "www/"
          bye
          LFTP_COMMANDS
